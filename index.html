    <!-- DESIGN.md §10: no web font blocks first paint. A plain stylesheet link
         sits in the critical path and delays FCP on every visit. Fetching it at
         print priority and promoting it to `all` once it has loaded keeps it
         off that path; `display=swap` means text is painted in the fallback
         face meanwhile rather than held back. The <noscript> copy keeps the
         fonts for readers without scripting. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
      />
    </noscript>
